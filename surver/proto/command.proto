syntax = "proto3";
package helloworld;

service Greeter {
    rpc SayHello (HelloRequest) returns (HelloReply);
    rpc GetFavicon (FaviconRequest) returns (FaviconReply);

}



message FaviconRequest {
    string paths = 1;
}



message FaviconReply {
    string datas = 1;
    bytes rawBytes = 2;
}

